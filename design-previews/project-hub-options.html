ole:['Counselor','مرشد'],adminRole:['Admin','مسؤول'],destination:['Demo tool preview','معاينة الأداة التجريبية'],destinationText:['This is a fictional project for the design preview.','هذا مشروع وهمي لمعاينة التصميم.'],save:['Save changes','حفظ التغييرات'],cancel:['Cancel','إلغاء'],editPreview:['Edit project','تعديل المشروع'],addPreview:['Add a project','إضافة مشروع'],personPreview:['Add a team member','إضافة عضو للفريق']
 };
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const models=[];
 for(const [index,type] of ['workspace','directory','board'].entries()){
  const app=root.querySelector('#nh-'+type);
  const saved=window.openai?.widgetState?.privateContent?.views?.[index];
  const model={type,app,index,ar:!!saved?.ar,dark:!!saved?.dark,role:saved?.role==='admin'?'admin':'counselor',page:['projects','login','admin'].includes(saved?.page)?saved.page:'projects',tab:'projects',query:'',filter:'all',dialog:null,compact:false};
  models.push(model);
  const t=k=>words[k]?.[model.ar?1:0]||k;
  const text=p=>p[model.ar?'ar':'en'];
  const desc=p=>p[model.ar?'descAr':'desc'];
  const badge=s=>`<span class="nh-status nh-${s}">${t(s)}</span>`;
  const button=(label,action,cls='')=>`<button type="button" class="${cls}" data-action="${action}">${label}</button>`;
  const persist=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{designPreviews:models.map(m=>({design:m.type,language:m.ar?'Arabic':'English',role:m.role,screen:m.page}))},privateContent:{views:models.map(m=>({ar:m.ar,dark:m.dark,role:m.role,page:m.page}))}}).catch(()=>{});};
  function card(p){return `<article class="nh-project" data-tool="${p.id}"><div class="nh-project-top"><span class="nh-icon" aria-hidden="true"><i data-lucide="${({planner:"calendar-days",resources:"library-big",intake:"clipboard-list",followup:"bell",workshops:"palette",archive:"archive"})[p.id]}"></i></span>${badge(p.status)}</div><h3>${text(p)}</h3><p>${desc(p)}</p><div class="nh-project-bottom"><span class="nh-muted nh-small">${p[model.ar?'categoryAr':'category']}</span>${button(t('open'),'open:'+p.id,'nh-open')}</div></article>`;}
  function filtered(){return projects.filter(p=>(model.role==='admin'||p.status!=='archived')&&(model.filter==='all'||p.status===model.filter)&&`${text(p)} ${desc(p)}`.toLocaleLowerCase().includes(model.query.toLocaleLowerCase()));}
  function results(){const list=filtered();if(!list.length)return `<div class="nh-empty">${t('empty')}</div>`;if(type==='directory')return `<div class="nh-list">${list.map(p=>`<article class="nh-row"><span class="nh-icon" aria-hidden="true"><i data-lucide="${({planner:"calendar-days",resources:"library-big",intake:"clipboard-list",followup:"bell",workshops:"palette",archive:"archive"})[p.id]}"></i></span><div class="nh-row-main"><h3>${text(p)}</h3><p>${desc(p)}</p></div>${badge(p.status)}${button(t('open'),'open:'+p.id,'nh-open')}</article>`).join('')}</div>`;if(type==='board')return `<div class="nh-columns">${['live','maintenance','development',...(model.role==='admin'?['archived']:[])].filter(s=>model.filter==='all'||model.filter===s).map(s=>`<section><div class="nh-column-head">${badge(s)}<span class="nh-muted nh-small">${list.filter(p=>p.status===s).length}</span></div><div class="nh-column">${list.filter(p=>p.status===s).map(card).join('')}</div></section>`).join('')}</div>`;return `<div class="nh-grid">${list.map(card).join('')}</div>`;}
  function filters(){return `<div class="nh-filters"><label class="nh-search"><span class="sr-only">${t('search')}</span><input data-field="search" aria-label="${t('search')}" placeholder="${t('search')}" value="${esc(model.query)}"></label><select data-field="filter" aria-label="${t('status')}">${['all','live','maintenance','development',...(model.role==='admin'?['archived']:[])].map(s=>`<option value="${s}" ${model.filter===s?'selected':''}>${t(s)}</option>`).join('')}</select></div>`;}
  function projectPage(){return `<div class="nh-heading"><div><h1>${model.ar?'أدواتك ومشاريعك':'Your project toolbox'}</h1><p>${t('intro')}</p></div>${model.role==='admin'?button(t('add'),'add','nh-primary'):''}</div>${filters()}<div data-results aria-live="polite">${results()}</div><p class="nh-demo-footer">${t('demo')}</p>`;}
  function adminPage(){const people=[['Maya Salem','maya@example.com','adminRole','fixed'],['Omar Nasser','omar@example.com','adminRole',''],['Dana Ali','dana@example.com','counselorRole',''],['Noor Ahmad','noor@example.com','counselorRole','']];return `<div class="nh-heading"><div><h1>${t('manage')}</h1><p>${t('manageDesc')}</p></div>${button(t(model.tab==='projects'?'add':'addPerson'),model.tab==='projects'?'add':'add-person','nh-primary')}</div><div class="nh-admin-tabs">${['projects','team'].map(tab=>`<button type="button" data-action="tab:${tab}" aria-pressed="${model.tab===tab}">${t(tab)}</button>`).join('')}</div><div class="nh-table-wrap">${model.tab==='projects'?`<table class="nh-table"><thead><tr><th>${t('name')}</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead><tbody>${projects.map(p=>`<tr><td>${text(p)}<small>${p[model.ar?'categoryAr':'category']}</small></td><td>${badge(p.status)}</td><td>${button(t('edit'),'edit:'+p.id)}</td></tr>`).join('')}</tbody></table>`:`<table class="nh-table"><thead><tr><th>${t('person')}</th><th>${t('role')}</th><th>${t('actions')}</th></tr></thead><tbody>${people.map(([n,e,r,f])=>`<tr><td>${n}<small>${e}</small></td><td>${t(r)}</td><td>${f?`<span class="nh-muted nh-small">${t(f)}</span>`:button(t('edit'),'person:'+e)}</td></tr>`).join('')}</tbody></table>`}</div><p class="nh-demo-footer">${t('restart')}</p>`;}
  function loginPage(){return `<div class="nh-login"><div class="nh-login-story"><div class="nh-line"></div><h1>${t('heading')}</h1><p>${t('intro')}</p></div><div class="nh-login-choice"><h2>${t('choose')}</h2><p class="nh-muted">${t('chooseDesc')}</p>${button(`<strong>${t('counselor')}</strong><span class="nh-muted">${t('counselorDesc')}</span>`,'role:counselor','nh-option')}${button(`<strong>${t('administrator')}</strong><span class="nh-muted">${t('adminDesc')}</span>`,'role:admin','nh-option')}<p class="nh-muted nh-small">${t('restart')}</p></div></div>`;}
  function dialog(){if(!model.dialog)return '';const p=projects.find(p=>p.id===model.dialog.id);const editing=model.dialog.kind==='edit';return `<div class="nh-dialog"><section class="nh-dialog-panel" role="dialog" aria-modal="true" aria-label="${t(editing?'editPreview':'destination')}"><h2>${p?text(p):t(model.dialog.kind==='add-person'?'personPreview':'addPreview')}</h2>${p?badge(p.status):''}<p class="nh-muted">${t(model.dialog.kind==='open'?'destinationText':'restart')}</p>${editing?`<label>${t('status')}<select data-field="edit-status">${['live','maintenance','development','archived'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${t(s)}</option>`).join('')}</select></label><h3>${t('private')}</h3><p class="nh-muted">${t('note')}</p>`:''}<div class="nh-tools">${editing?button(t('save'),'save','nh-primary'):''}${button(t('close'),'close')}</div></section></div>`;}
  function render(){app.setAttribute('dir',model.ar?'rtl':'ltr');app.setAttribute('lang',model.ar?'ar':'en');app.dataset.theme=model.dark?'dark':'light';app.style.setProperty('--nh-card-gap',model.compact?'10px':'14px');const nav=`${button(t('projects'),'page:projects',model.page==='projects'?'nh-active':'')}${model.role==='admin'?button(t('admin'),'page:admin',model.page==='admin'?'nh-active':''):''}`;app.innerHTML=`<header class="nh-header"><div class="nh-brand"><span>Project Hub<span class="nh-muted nh-small" style="display:block;letter-spacing:0;font-family:Inter,Cairo,sans-serif;font-weight:400">${model.ar?'بيئة تجريبية':'Demo workspace'}</span></span></div><div class="nh-tools">${button(model.ar?'English':'العربية','language')}${button(t(model.dark?'light':'theme'),'theme')}${button(t(model.role==='admin'?'administrator':'counselor'),'page:login','nh-role')}</div></header>${model.page==='login'?loginPage():type==='workspace'?`<div class="nh-body"><nav class="nh-sidebar" aria-label="${t('projects')}">${nav}<div class="nh-sidebar-footer"><p class="nh-muted nh-small">${t('demo')}</p></div></nav><main class="nh-content">${model.page==='admin'?adminPage():projectPage()}</main></div>`:`<nav class="nh-nav" aria-label="${t('projects')}">${nav}</nav><main class="nh-content">${model.page==='admin'?adminPage():projectPage()}</main>`}${dialog()}`;const cols=app.querySelector('.nh-columns');if(cols&&model.role==='admin'&&model.filter==='all'&&window.innerWidth>750)cols.style.gridTemplateColumns='repeat(4,minmax(0,1fr))';app.querySelectorAll('.nh-grid').forEach(el=>el.style.gap=model.compact?'10px':'14px');}
  app.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b)return;const [action,arg]=b.dataset.action.split(':');if(action==='language')model.ar=!model.ar;if(action==='theme')model.dark=!model.dark;if(action==='page'){model.page=arg==='admin'&&model.role!=='admin'?'projects':arg;model.dialog=null;}if(action==='role'){model.role=arg;model.page='projects';model.filter='all';model.query='';}if(action==='tab')model.tab=arg;if(['open','edit'].includes(action))model.dialog={kind:action,id:arg};if(['add','add-person','person'].includes(action))model.dialog={kind:action,id:null};if(action==='close')model.dialog=null;if(action==='save'){const p=projects.find(p=>p.id===model.dialog?.id);if(p)p.status=app.querySelector('[data-field="edit-status"]').value;model.dialog=null;}render();if(typeof lucide !== 'undefined')lucide.createIcons({attrs:{width:24,height:24}});persist();if(model.dialog)app.querySelector('.nh-dialog button')?.focus();});
  app.addEventListener('input',event=>{if(event.target.dataset.field==='search'){model.query=event.target.value;app.querySelector('[data-results]').innerHTML=results();if(typeof lucide !== 'undefined')lucide.createIcons({attrs:{width:24,height:24}});}});
  app.addEventListener('change',event=>{if(event.target.dataset.field==='filter'){model.filter=event.target.value;app.querySelector('[data-results]').innerHTML=results();if(typeof lucide !== 'undefined')lucide.createIcons({attrs:{width:24,height:24}});}});
  app.addEventListener('keydown',event=>{if(event.key==='Escape'&&model.dialog){model.dialog=null;render();}});
  render();
  if(typeof lucide !== 'undefined')lucide.createIcons({attrs:{width:24,height:24}});
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:render});tweak.addToggle(model,'compact',{label:'Compact card spacing'});}
  model.render=render;
 }
 window.addEventListener('openai:set_globals',event=>{const views=event.detail?.globals?.widgetState?.privateContent?.views;if(!views)return;models.forEach((m,i)=>{if(!views[i])return;const v=views[i];m.ar=!!v.ar;m.dark=!!v.dark;m.role=v.role==='admin'?'admin':'counselor';m.page=['projects','login','admin'].includes(v.page)?v.page:'projects';m.render();});});
 const iconCache=new Map();
 const restoreIcons=()=>root.querySelectorAll('[data-lucide]').forEach(el=>{
  const name=el.getAttribute('data-lucide');
  if(el.tagName.toLowerCase()==='svg')iconCache.set(name,el.cloneNode(true));
  else if(iconCache.has(name))el.replaceWith(iconCache.get(name).cloneNode(true));
 });
 restoreIcons();
 new MutationObserver(restoreIcons).observe(root,{childList:true,subtree:true});
})();
</script>
